# ===== 자동 알림 (톡톡으로 감) =====
# {0} = 책 제목, {1}·{2} = 숫자나 날짜

notify.date={0}월 {1}일

notify.requested=📝 "{0}" 대출 신청이 접수되었습니다. 승인을 기다려 주세요.
notify.approved=📚 "{0}" 대출이 승인되었습니다. 도서관에 오셔서 책을 받아 가세요.
notify.canceled=❌ "{0}" 대출 신청이 취소되었습니다.
notify.extended=🔁 "{0}" 반납 기한이 {1}로 연장되었습니다. (연장은 1회만 가능합니다)
notify.returned=✅ "{0}" 반납이 완료되었습니다. 이용해 주셔서 감사합니다!
notify.overdueReturned=⚠️ "{0}" 반납 기한을 {1}일 넘겨서 {2}까지 대출이 정지됩니다.
notify.lost=❌ "{0}" 책이 분실 처리되었습니다. 도서관에 문의해 주세요.

# 반납 기한 알림 (매일 아침 9시)
notify.due.days=⏰ "{0}" 반납 기한이 {1}일 남았습니다.
notify.due.tomorrow=⏰ "{0}" 반납 기한이 내일입니다.
notify.due.today=📅 "{0}" 반납 기한이 오늘입니다. 오늘 안에 반납해 주세요.
notify.due.over=⚠️ "{0}" 반납 기한이 지났습니다. 빨리 반납해 주세요.
notify.due.suffix=(반납 기한: {0})