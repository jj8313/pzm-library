# ===== 自動通知 (チャットに届く) =====
# {0} = 書名, {1}・{2} = 数字や日付

notify.date={0}月{1}日

notify.requested=📝 「{0}」の貸出申請を受け付けました。承認をお待ちください。
notify.approved=📚 「{0}」の貸出が承認されました。図書館で本をお受け取りください。
notify.canceled=❌ 「{0}」の貸出申請が取り消されました。
notify.extended=🔁 「{0}」の返却期限が{1}に延長されました。（延長は1回のみ可能です）
notify.returned=✅ 「{0}」の返却が完了しました。ご利用ありがとうございました！
notify.overdueReturned=⚠️ 「{0}」の返却期限を{1}日過ぎたため、{2}まで貸出が停止されます。
notify.lost=❌ 「{0}」は紛失として処理されました。図書館にお問い合わせください。

# 返却期限の通知 (毎朝9時)
notify.due.days=⏰ 「{0}」の返却期限まであと{1}日です。
notify.due.tomorrow=⏰ 「{0}」の返却期限は明日です。
notify.due.today=📅 「{0}」の返却期限は本日です。本日中にご返却ください。
notify.due.over=⚠️ 「{0}」の返却期限が過ぎています。至急ご返却ください。
notify.due.suffix=（返却期限: {0}）