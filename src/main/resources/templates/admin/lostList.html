<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}">
<head>
  <meta charset="UTF-8">
  <title th:text="#{adminLost.pageTitle}">분실 도서 - 관리자</title>
  <link rel="stylesheet" th:href="@{/css/common.css}">
  <link rel="stylesheet" th:href="@{/css/admin.css}">
</head>
<body>

<div th:replace="~{fragments/header :: header}"></div>

<div class="admin-box">

  <div class="admin-top">
    <h2>
      <span th:text="#{adminLost.title}">❌ 분실 도서</span>
      <span class="sub" th:text="#{book.totalPre} + ' ' + ${lostBooks.size()} + #{admin.unit}"></span>
    </h2>
    <a href="/admin/books/list" class="top-btn" th:text="#{adminLost.back}">← 도서 관리</a>
  </div>

  <table class="loan-table">
    <tr>
      <th style="width:120px;" th:text="#{adminLost.lostAt}">분실 처리일</th>
      <th style="width:100px;" th:text="#{admin.col.member}">회원</th>
      <th th:text="#{admin.col.book}">책</th>
      <th style="width:90px;" th:text="#{admin.col.barcode}">바코드</th>
      <th style="width:120px;" th:text="#{adminLost.reason}">사유</th>
    </tr>

    <tr th:each="lost : ${lostBooks}">
      <td th:text="${#temporals.format(lost.lostAt, 'MM.dd HH:mm')}"></td>

      <!-- 회원: 있으면 회원 상세 링크, 없으면 - -->
      <td>
        <a th:if="${lost.memberId != null}"
           th:href="@{/admin/members/{id}(id=${lost.memberId})}" th:text="${lost.nickname}"></a>
        <span th:unless="${lost.memberId != null}" style="color:#ccc;">-</span>
      </td>

      <!-- 책: 누르면 그 책의 실물·대출 이력 화면 -->
      <td><a th:href="@{/admin/books/{id}/loans(id=${lost.bookId})}" th:text="${lost.title}"></a></td>

      <td th:text="${lost.barcode}"></td>
      <!-- 사유: 관리자가 직접 쓴 데이터라서 번역 안 함 -->
      <td th:text="${lost.reason != null} ? ${lost.reason} : '-'"></td>
    </tr>

    <tr th:if="${lostBooks.isEmpty()}">
      <td colspan="5" class="empty" th:text="#{adminLost.empty}">분실된 책이 없습니다.</td>
    </tr>
  </table>
</div>
<div th:replace="~{fragments/footer :: footer}"></div>

</body>
</html>
