<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}">
<head>
  <meta charset="UTF-8">
  <title th:text="#{boardDetail.pageTitle}">게시글 - PZM 도서관</title>
  <link rel="stylesheet" th:href="@{/css/common.css}">
  <link rel="stylesheet" th:href="@{/css/boarddetail.css}">
</head>
<body>

<div th:replace="~{fragments/header :: header}"></div>

<!-- isAdmin: 관리자인지 한 번만 계산해 두고 아래에서 계속 씀 -->
<div class="detail-wrap"
     th:with="isAdmin=${loginMember != null and loginMember.isAdmin()}">

  <!-- ===== 글 영역 ===== -->
  <div class="post-box">

    <div class="post-head">
      <h2 class="post-title">
        <span th:text="${post.title}"></span>
        <span class="comment-count"
              th:if="${!comments.isEmpty()}"
              th:text="'(' + ${comments.size()} + ')'"></span>
      </h2>
      <div class="post-meta">
        <span class="writer" th:text="${post.nickname}"></span>
        <span class="meta-right">
          <span th:text="${#temporals.format(post.createdAt, 'yyyy.MM.dd HH:mm')}"></span>
          <span th:text="#{boardDetail.view} + ' ' + ${post.viewCount}"></span>
        </span>
      </div>
    </div>

    <div class="post-body">
      <!-- 이미지 (있을 때만) -->
      <div class="post-images" th:if="${images != null and !images.isEmpty()}">
        <img th:each="img : ${images}" th:src="@{'/upload/' + ${img}}" th:alt="#{boardDetail.imageAlt}">
      </div>

      <!-- 본문 (데이터라서 번역 안 함) -->
      <div class="post-content" th:text="${post.content}"></div>
    </div>

    <div class="post-buttons">
      <a href="/board/list" class="btn btn-gray" th:text="#{boardDetail.list}">목록</a>

      <!-- 내 글이거나 관리자일 때 버튼 영역 -->
      <div class="right" th:if="${loginMember != null and (loginMember.id == post.memberId or isAdmin)}">
        <!-- 수정: 내 글일 때만 -->
        <a th:if="${loginMember.id == post.memberId}"
           th:href="@{'/board/edit/' + ${post.id}}" class="btn btn-blue"
           th:text="#{boardDetail.edit}">수정</a>
        <!-- 삭제: 내 글 또는 관리자 -->
        <form th:action="@{'/board/delete/' + ${post.id}}" method="post"
              style="display:inline"
              th:data-confirm="#{boardDetail.deleteConfirm}"
              onsubmit="return confirm(this.dataset.confirm);">
          <button type="submit" class="btn btn-dark" th:text="#{boardDetail.delete}">삭제</button>
        </form>
      </div>
    </div>
  </div>

  <!-- ===== 댓글 영역 ===== -->
  <div class="comment-box">
    <h3 class="comment-head">
      <span th:text="#{boardDetail.comments}">댓글</span> <span th:text="${comments.size()}"></span>
    </h3>

    <ul class="comment-list">

      <!-- 1. 원래 댓글만 (parentId가 없는 것) -->
      <th:block th:each="comment : ${comments}" th:if="${comment.parentId == null}">
        <li class="comment">
          <div class="c-writer" th:text="${comment.nickname}"></div>
          <div class="c-content" th:text="${comment.content}"></div>
          <div class="c-date" th:text="${#temporals.format(comment.createdAt, 'yyyy.MM.dd HH:mm')}"></div>

          <div class="c-actions">
            <!-- 답글 쓰기: 로그인했으면 누구나 (원래 댓글에만) -->
            <details class="c-edit" th:if="${loginMember != null}">
              <summary th:text="#{boardDetail.reply}">답글</summary>
              <form th:action="@{'/board/comment/' + ${comment.id} + '/reply'}" method="post"
                    style="display:flex; gap:8px; width:100%; margin-top:8px;">
                <input type="hidden" name="postId" th:value="${post.id}">
                <textarea name="content" required th:placeholder="#{boardDetail.replyPlaceholder}"
                          style="flex:1; min-height:80px; padding:10px; font-size:14px;
                                 border:1px solid #ccc; border-radius:6px; resize:vertical;"></textarea>
                <button type="submit"
                        style="width:80px; background:#3498db; color:#fff; border:none;
                               border-radius:6px; cursor:pointer;"
                        th:text="#{boardDetail.submit}">등록</button>
              </form>
            </details>

            <!-- 수정: 내 댓글일 때만 -->
            <details class="c-edit" th:if="${loginMember != null and loginMember.id == comment.memberId}">
              <summary th:text="#{boardDetail.edit}">수정</summary>
              <form th:action="@{'/board/comment/edit/' + ${comment.id}}" method="post">
                <textarea name="content" required th:text="${comment.content}"></textarea>
                <button type="submit" th:text="#{boardDetail.save}">저장</button>
              </form>
            </details>

            <!-- 삭제: 내 댓글 또는 관리자 -->
            <form th:if="${loginMember != null and (loginMember.id == comment.memberId or isAdmin)}"
                  th:action="@{'/board/comment/delete/' + ${comment.id}}"
                  method="post" class="c-delete"
                  th:data-confirm="#{boardDetail.commentDeleteConfirm}"
                  onsubmit="return confirm(this.dataset.confirm);">
              <button type="submit" th:text="#{boardDetail.delete}">삭제</button>
            </form>
          </div>
        </li>

        <!-- 2. 이 댓글의 답글만 (parentId가 이 댓글 번호인 것) -->
        <li class="comment" th:each="reply : ${comments}" th:if="${reply.parentId == comment.id}"
            style="margin-left:32px; background:#f8f9fa; border-left:3px solid #dfe6e9;">
          <div class="c-writer" th:text="'↳ ' + ${reply.nickname}"></div>
          <div class="c-content" th:text="${reply.content}"></div>
          <div class="c-date" th:text="${#temporals.format(reply.createdAt, 'yyyy.MM.dd HH:mm')}"></div>

          <!-- 내 답글이거나 관리자일 때 버튼 영역 -->
          <div class="c-actions"
               th:if="${loginMember != null and (loginMember.id == reply.memberId or isAdmin)}">
            <!-- 수정: 내 답글일 때만 -->
            <details class="c-edit" th:if="${loginMember.id == reply.memberId}">
              <summary th:text="#{boardDetail.edit}">수정</summary>
              <form th:action="@{'/board/comment/edit/' + ${reply.id}}" method="post">
                <textarea name="content" required th:text="${reply.content}"></textarea>
                <button type="submit" th:text="#{boardDetail.save}">저장</button>
              </form>
            </details>
            <!-- 삭제: 내 답글 또는 관리자 -->
            <form th:action="@{'/board/comment/delete/' + ${reply.id}}"
                  method="post" class="c-delete"
                  th:data-confirm="#{boardDetail.replyDeleteConfirm}"
                  onsubmit="return confirm(this.dataset.confirm);">
              <button type="submit" th:text="#{boardDetail.delete}">삭제</button>
            </form>
          </div>
        </li>
      </th:block>

      <!-- 댓글이 없을 때 -->
      <li class="comment" th:if="${comments.isEmpty()}">
        <div class="c-content empty-comment" th:text="#{boardDetail.noComment}">첫 댓글을 남겨보세요.</div>
      </li>
    </ul>

    <!-- 댓글 쓰기 (원래 댓글) -->
    <form class="comment-form" th:action="@{'/board/' + ${post.id} + '/comment'}" method="post">
      <textarea name="content" required
                th:placeholder="${loginMember != null} ? #{boardDetail.commentPlaceholder} : #{boardDetail.loginToComment}"
                th:disabled="${loginMember == null}"></textarea>
      <button type="submit" th:disabled="${loginMember == null}" th:text="#{boardDetail.submit}">등록</button>
    </form>
  </div>

</div>
<div th:replace="~{fragments/footer :: footer}"></div>

</body>
</html>
