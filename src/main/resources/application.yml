server:
  port: 8080
spring:
  config:
    import: optional:classpath:application-secret.yml
  messages:
    basename: i18n/messages,i18n/book,i18n/board,i18n/member,i18n/mypage,i18n/loan,i18n/talk,i18n/admin,i18n/notify
    fallback-to-system-locale: false
  application:
    name: demo
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/pratice_library?serverTimezone=Asia/Seoul&characterEncoding=UTF-8&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: ${DB_PASSWORD}
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 30MB

mybatis:
  mapper-locations: classpath:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true

kakao:
  rest-key: ${KAKAO_REST_KEY}
upload:
  dir: ${UPLOAD_DIR:C:/pzm-upload/}